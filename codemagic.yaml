workflows:
  ios-simulator-check:
    name: Aim Range - unsigned iOS build check
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Inspect Xcode project
        script: |
          xcodebuild -list -project AimRange.xcodeproj
      - name: Build for iOS Simulator (no signing required)
        script: |
          set -o pipefail
          xcodebuild \
            -project AimRange.xcodeproj \
            -scheme AimRange \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build/ios-simulator-build.log
    artifacts:
      - build/DerivedData/Build/Products/**/*.app
      - build/ios-simulator-build.log
